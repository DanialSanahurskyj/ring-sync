<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ring">
<title>Ring</title>
<style>
:root{--bg:#0e1113;--card:#161a1d;--card2:#1c2125;--line:#262c30;--txt:#e8ecee;--mut:#8a959c;--dim:#5d676d;
--acc:#2fbf8f;--blue:#4a9be8;--violet:#8f86e8;--amber:#e8a33a;--coral:#e06a4f;--band:rgba(47,191,143,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
a{color:var(--acc);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.top h1{margin:0;font-size:26px;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:13px}
.dim{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{display:flex;gap:18px;align-items:center}
.hero .txt{flex:1;min-width:0}
.hero h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .k{color:var(--mut);font-size:12px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--mut);margin-left:2px}
.tile .d{font-size:12px;margin-top:2px}
.up{color:var(--coral)} .dn{color:var(--acc)} .flat{color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec b{font-size:15px}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{font:inherit;font-size:13px;background:none;border:0;color:var(--mut);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button.on{background:#2a3136;color:var(--txt)}
.nav{display:flex;align-items:center;gap:6px}
.nav button{font:inherit;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;width:32px;height:30px;cursor:pointer}
.nav button:disabled{opacity:.3}
.chart{position:relative;height:190px}
.chart.tall{height:220px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.flag:first-of-type{border-top:0;padding-top:2px}
.flag .i{width:22px;flex:none;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.empty{color:var(--mut);font-size:13px;padding:28px 0;text-align:center}
input{width:100%;font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
.btn{font:inherit;font-size:14px;background:var(--acc);color:#04130d;font-weight:600;border:0;border-radius:11px;padding:11px 16px;cursor:pointer}
.ghost{font:inherit;font-size:13px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.skel{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px;height:120px;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="top">
  <div><h1>Ring</h1><div class="mut" id="sub">Loading…</div></div>
  <div style="display:flex;gap:8px"><button class="ghost" id="reload" aria-label="Refresh">↻</button><a class="ghost" href="./" style="display:inline-block">Sync</a></div>
</div>

<div id="setup" class="card" hidden>
  <b>Connect your data repo</b>
  <p class="mut" style="margin:6px 0 10px">Same details as the sync page. The token stays on this device.</p>
  <label class="mut">Username<input id="u" autocapitalize="off" autocorrect="off"></label>
  <label class="mut" style="display:block;margin-top:8px">Repo<input id="r" value="ring-data" autocapitalize="off" autocorrect="off"></label>
  <label class="mut" style="display:block;margin-top:8px">Token<input id="t" type="password" autocapitalize="off" autocorrect="off"></label>
  <div style="margin-top:12px"><button class="btn" id="save">Save</button></div>
  <p class="mut" id="err"></p>
</div>

<div id="loading"><div class="skel"></div><div class="skel" style="height:90px"></div><div class="skel" style="height:220px"></div></div>

<div id="app" hidden>
  <div class="card hero">
    <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="Recovery score">
      <circle cx="52" cy="52" r="44" fill="none" stroke="#262c30" stroke-width="9"/>
      <circle id="arc" cx="52" cy="52" r="44" fill="none" stroke="#2fbf8f" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 277" transform="rotate(-90 52 52)" style="transition:stroke-dasharray .8s ease"/>
      <text id="score" x="52" y="58" text-anchor="middle" fill="#e8ecee" font-size="28" font-weight="700">–</text>
      <text x="52" y="76" text-anchor="middle" fill="#8a959c" font-size="10">recovery</text>
    </svg>
    <div class="txt"><h2 id="heroT">–</h2><div class="mut" id="heroD"></div></div>
  </div>

  <div class="grid">
    <div class="tile"><div class="k">Resting HR</div><div class="v" id="tRhr">–</div><div class="d" id="tRhrD"></div></div>
    <div class="tile"><div class="k">Sleep (est.)</div><div class="v" id="tSl">–</div><div class="d" id="tSlD"></div></div>
    <div class="tile"><div class="k">Steps today</div><div class="v" id="tSt">–</div><div class="d" id="tStD"></div></div>
    <div class="tile"><div class="k">Ring</div><div class="v" id="tBat">–</div><div class="d" id="tBatD"></div></div>
  </div>

  <div class="card" id="flagsCard" hidden><div class="sec"><b>Flags</b></div><div id="flags"></div></div>

  <div class="card">
    <div class="sec"><b id="dayT">Today</b>
      <div class="nav"><button id="prev" aria-label="Previous day">‹</button><button id="next" aria-label="Next day">›</button></div></div>
    <div class="chart tall"><canvas id="cDay"></canvas></div>
    <div class="dim" id="dayS" style="margin-top:8px"></div>
  </div>

  <div class="sec" style="margin:18px 2px 8px"><b>Trends</b>
    <div class="seg" id="range"><button data-n="14" class="on">2W</button><button data-n="30">1M</button><button data-n="90">3M</button></div></div>

  <div class="card">
    <div class="sec"><b>Resting heart rate</b><span class="dim" id="rhrNote"></span></div>
    <div class="chart"><canvas id="cRhr"></canvas></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>Nightly</span><span><i style="background:var(--band)"></i>Your normal</span><span><i style="background:var(--coral)"></i>Unusual</span></div>
  </div>

  <div class="card">
    <div class="sec"><b>Sleep window</b><span class="dim" id="slNote"></span></div>
    <div class="chart"><canvas id="cSleep"></canvas></div>
    <div class="legend"><span><i style="background:var(--violet)"></i>7 h or more</span><span><i style="background:var(--amber)"></i>Under 7 h</span></div>
  </div>

  <div class="card">
    <div class="sec"><b>Steps</b><span class="dim" id="stNote"></span></div>
    <div class="chart"><canvas id="cSteps"></canvas></div>
  </div>

  <p class="dim" style="text-align:center;margin-top:16px" id="foot"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const TZ = "America/Indiana/Indianapolis";
const store = { get(k){ try { return localStorage.getItem("rs_" + k) || ""; } catch { return ""; } }, set(k, v){ try { localStorage.setItem("rs_" + k, v); } catch {} } };
const LOCAL = new URLSearchParams(location.search).has("local");   // dev: read ./data next to the page

// ---------- data ----------
async function getFile(path){
  if (LOCAL) { const r = await fetch("./" + path + "?t=" + Date.now()); if (!r.ok) throw new Error(path + " " + r.status); return r.text(); }
  const u = store.get("user"), repo = store.get("repo") || "ring-data", tok = store.get("tok");
  const r = await fetch(`https://api.github.com/repos/${u}/${repo}/contents/${path}?t=${Date.now()}`,
    { headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" }, cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) { let m = ""; try { m = (await r.json()).message; } catch {} throw new Error(`GitHub ${r.status}${m ? ": " + m : ""}`); }
  return r.text();
}
function csv(text){
  if (!text) return [];
  const [head, ...rows] = text.trim().split(/\r?\n/), keys = head.split(",");
  return rows.map(l => { const v = l.split(","), o = {}; keys.forEach((k, i) => { const x = v[i]; o[k] = x === "" || x === undefined ? null : (isNaN(+x) || /^\d{4}-/.test(x) ? x : +x); }); return o; });
}
const ts = s => s ? new Date(s.replace(" ", "T")) : null;

// ---------- time helpers (local = Indianapolis) ----------
const fmtDay = d => d.toLocaleDateString("en-US", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });
const localDateStr = d => d.toLocaleDateString("en-CA", { timeZone: TZ });           // YYYY-MM-DD
const hrsMin = h => h == null ? "–" : `${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, "0")}m`;
const clock = d => d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).replace(":00", "").replace(" ", "").toLowerCase();
const hourOf = d => { const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(d); return +p.find(x => x.type === "hour").value + +p.find(x => x.type === "minute").value / 60; };
const hourLbl = h => { const hh = ((Math.round(h) % 24) + 24) % 24; return (hh % 12 || 12) + (hh < 12 ? "a" : "p"); };
const hm = h => { const H = Math.floor(h), M = Math.round((h - H) * 60); return `${(H % 12) || 12}:${String(M).padStart(2, "0")}${H < 12 ? "am" : "pm"}`; };
const Phi = x => { const t = 1/(1+0.2316419*Math.abs(x)), d = 0.3989423*Math.exp(-x*x/2), p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return x > 0 ? 1-p : p; };

// ---------- chart theme ----------
Chart.defaults.color = "#8a959c"; Chart.defaults.borderColor = "#262c30"; Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,sans-serif"; Chart.defaults.font.size = 11;
const base = { responsive: true, maintainAspectRatio: false, animation: { duration: 350 },
  plugins: { legend: { display: false }, tooltip: { backgroundColor: "#22282c", borderColor: "#333a3f", borderWidth: 1, padding: 10, displayColors: false } },
  scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } }, y: { grid: { color: "#20262a" }, border: { display: false } } } };
const charts = {};
function chart(id, cfg){ if (charts[id]) charts[id].destroy(); charts[id] = new Chart($(id), cfg); }

// ---------- state ----------
let D = { daily: [], hr: [], steps: [], meta: {} }, dayOffset = 0, range = 14;

async function load(){
  $("loading").hidden = false; $("app").hidden = true; $("setup").hidden = true;
  if (!LOCAL && !(store.get("user") && store.get("tok"))) { showSetup(); return; }
  try {
    const [daily, hr, steps, meta] = await Promise.all(["data/daily.csv", "data/hr.csv", "data/steps.csv", "data/meta.json"].map(getFile));
    if (!hr) { $("loading").hidden = true; $("sub").textContent = "No data yet. Sync your ring first."; return; }
    D = { daily: csv(daily), hr: csv(hr).map(r => ({ t: new Date(r.ts * 1000), v: r.bpm })), steps: csv(steps).map(r => ({ t: new Date(r.ts * 1000), v: r.steps })), meta: meta ? JSON.parse(meta) : {} };
    D.daily.forEach(r => { r.sleep_start = ts(r.sleep_start); r.sleep_end = ts(r.sleep_end); });
    render();
  } catch (e) { $("loading").hidden = true; showSetup(e.message); }
}
function showSetup(msg){
  $("loading").hidden = true; $("setup").hidden = false; $("sub").textContent = "Not connected";
  $("u").value = store.get("user"); $("r").value = store.get("repo") || "ring-data"; $("err").textContent = msg ? "❌ " + msg : "";
}
$("save").onclick = () => { store.set("user", $("u").value.trim()); store.set("repo", $("r").value.trim() || "ring-data"); if ($("t").value.trim()) store.set("tok", $("t").value.trim()); $("t").value = ""; load(); };
$("reload").onclick = load;

// ---------- render ----------
function render(){
  $("loading").hidden = true; $("app").hidden = false;
  const m = D.meta, n = D.daily, nights = n.filter(r => r.rhr != null);
  const synced = m.synced_at ? new Date(m.synced_at) : null;
  $("sub").textContent = synced ? `Synced ${fmtDay(synced)}, ${clock(synced)}` : "";
  $("foot").textContent = `${D.hr.length.toLocaleString()} heart-rate readings · ${nights.length} nights`;

  // hero: last night
  const last = nights[nights.length - 1];
  const need = (m.min_baseline || 7) - nights.length;
  const arc = $("arc"), sc = $("score");
  if (last && last.recovery != null) {
    const s = Math.round(last.recovery), col = s >= 67 ? "#2fbf8f" : s >= 34 ? "#e8a33a" : "#e06a4f";
    sc.textContent = s; arc.setAttribute("stroke", col); requestAnimationFrame(() => arc.setAttribute("stroke-dasharray", `${(2.765 * s).toFixed(1)} 277`));
    $("heroT").textContent = s >= 67 ? "Well recovered" : s >= 34 ? "Moderate recovery" : "Take it easy today";
    const z = last.rhr_z;
    $("heroD").textContent = `Resting HR ${Math.round(last.rhr)} vs your normal ${Math.round(last.rhr_base)}` + (last.sleep_h != null ? ` · slept ${hrsMin(last.sleep_h)}` : "");
  } else {
    sc.textContent = "–"; arc.setAttribute("stroke-dasharray", `${(277 * Math.max(0, nights.length) / (m.min_baseline || 7)).toFixed(1)} 277`); arc.setAttribute("stroke", "#4a5257");
    $("heroT").textContent = "Learning your normal";
    $("heroD").textContent = need > 0 ? `${nights.length} of ${m.min_baseline || 7} nights recorded. Recovery and flags unlock in ${need} more night${need === 1 ? "" : "s"}. Wear the ring to bed.` : "Waiting for the next night.";
  }

  // tiles
  if (last) {
    $("tRhr").innerHTML = `${Math.round(last.rhr)}<small>bpm</small>`;
    if (last.rhr_base != null) { const d = last.rhr - last.rhr_base; $("tRhrD").innerHTML = `<span class="${d > 1 ? "up" : d < -1 ? "dn" : "flat"}">${d > 0 ? "▲" : d < 0 ? "▼" : "•"} ${Math.abs(d).toFixed(1)}</span> <span class="mut">vs normal</span>`; }
    else $("tRhrD").innerHTML = `<span class="mut">last night</span>`;
    $("tSl").textContent = hrsMin(last.sleep_h);
    $("tSlD").innerHTML = last.sleep_start ? `<span class="mut">${clock(last.sleep_start)} – ${clock(last.sleep_end)}</span>` : `<span class="mut">no sleep detected</span>`;
  }
  const todayStr = localDateStr(new Date()), today = n.find(r => r.date === todayStr);
  const prev7 = n.filter(r => r.date < todayStr).slice(-7), avg7 = prev7.length ? prev7.reduce((a, r) => a + (r.steps || 0), 0) / prev7.length : null;
  $("tSt").textContent = today ? (today.steps || 0).toLocaleString() : "–";
  $("tStD").innerHTML = avg7 ? `<span class="mut">7-day avg ${Math.round(avg7).toLocaleString()}</span>` : "";
  $("tBat").innerHTML = m.battery != null ? `${m.battery}<small>%</small>` : "–";
  $("tBatD").innerHTML = `<span class="mut">${m.hr_interval ? "logging every " + m.hr_interval + " min" : ""}</span>`;

  // flags
  const F = [];
  if (last && last.rhr_z != null && last.rhr_z > 2) F.push(["⚠️", `Resting HR is ${last.rhr_z.toFixed(1)}σ above your normal. Common before getting sick, after alcohol, or after hard training.`]);
  if (last && last.sleep_h != null && last.sleep_h < 6) F.push(["😴", `Short night: ${hrsMin(last.sleep_h)}.`]);
  if (m.battery != null && m.battery < 25) F.push(["🔋", `Ring battery at ${m.battery}%. Charge it today.`]);
  const yday = n.filter(r => r.date < todayStr).slice(-1)[0];
  if (yday && yday.coverage < 0.5) F.push(["👀", `Only ${Math.round(yday.coverage * 100)}% of yesterday was recorded. Ring off, loose, or uncharged?`]);
  if (m.hr_interval && m.hr_interval !== 5) F.push(["⚙️", `Ring is logging every ${m.hr_interval} min. Set it to 5 on the sync page.`]);
  if (synced && Date.now() - synced > 36 * 3600e3) F.push(["🔄", `Last sync was ${Math.round((Date.now() - synced) / 864e5)} days ago. The ring holds about a week.`]);
  $("flagsCard").hidden = !F.length;
  $("flags").innerHTML = F.map(([i, t]) => `<div class="flag"><span class="i">${i}</span><span>${t}</span></div>`).join("");

  renderDay(); renderTrends();
}

function renderDay(){
  const now = new Date(), dayStr = localDateStr(new Date(now.getTime() - dayOffset * 864e5));
  const pts = D.hr.filter(p => localDateStr(p.t) === dayStr);
  const st = D.steps.filter(p => localDateStr(p.t) === dayStr);
  const firstDay = D.hr.length ? localDateStr(D.hr[0].t) : dayStr;
  $("prev").disabled = dayStr <= firstDay; $("next").disabled = dayOffset === 0;
  $("dayT").textContent = dayOffset === 0 ? "Today" : dayOffset === 1 ? "Yesterday" : fmtDay(new Date(now.getTime() - dayOffset * 864e5));
  const hrData = pts.map(p => ({ x: hourOf(p.t), y: p.v }));
  const stData = st.map(p => ({ x: hourOf(p.t) + 0.125, y: p.v }));
  const smooth = hrData.map((p, i, a) => { const w = a.slice(Math.max(0, i - 2), i + 3).map(q => q.y).sort((x, y) => x - y); return { x: p.x, y: w[Math.floor(w.length / 2)] }; });
  if (!hrData.length) { $("dayS").textContent = "No heart-rate data for this day."; }
  else { const v = pts.map(p => p.v); $("dayS").textContent = `${v.length} readings · low ${Math.min(...v)} · avg ${Math.round(v.reduce((a, b) => a + b, 0) / v.length)} · high ${Math.max(...v)} bpm · ${st.reduce((a, p) => a + p.v, 0).toLocaleString()} steps`; }
  chart("cDay", { data: { datasets: [
      { type: "bar", data: stData, yAxisID: "y1", backgroundColor: "rgba(143,134,232,.35)", barThickness: 4, borderRadius: 2, label: "steps" },
      { type: "scatter", data: hrData, pointRadius: 2.2, pointBackgroundColor: "rgba(47,191,143,.55)", pointBorderWidth: 0, label: "bpm" },
      { type: "line", data: smooth, borderColor: "#2fbf8f", borderWidth: 2, pointRadius: 0, tension: .35, label: "trend" } ] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { title: c => hm(c[0].parsed.x), label: c => c.dataset.label === "steps" ? `${c.parsed.y} steps` : `${c.parsed.y} bpm` } } },
      scales: { x: { type: "linear", min: 0, max: 24, grid: { display: false }, ticks: { stepSize: 6, callback: hourLbl } },
        y: { ...base.scales.y, suggestedMin: 45, suggestedMax: 110, ticks: { maxTicksLimit: 5 } },
        y1: { position: "right", display: false, beginAtZero: true, suggestedMax: 1500 } } } });
}

function renderTrends(){
  const rows = D.daily.slice(-range), lbl = rows.map(r => { const d = new Date(r.date + "T12:00:00"); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); });
  // RHR with normal band (median ± 1 MAD-sigma)
  const hi = rows.map(r => r.rhr_base != null ? r.rhr_base + r.rhr_mad : null), lo = rows.map(r => r.rhr_base != null ? r.rhr_base - r.rhr_mad : null);
  const unusual = rows.map(r => r.rhr_z != null && Math.abs(r.rhr_z) > 2 ? r.rhr : null);
  chart("cRhr", { type: "line", data: { labels: lbl, datasets: [
      { data: hi, borderWidth: 0, pointRadius: 0, fill: "+1", backgroundColor: "rgba(47,191,143,.16)", spanGaps: true },
      { data: lo, borderWidth: 0, pointRadius: 0, spanGaps: true },
      { data: rows.map(r => r.rhr), borderColor: "#4a9be8", backgroundColor: "#4a9be8", borderWidth: 2, pointRadius: range > 30 ? 0 : 2.5, tension: .3, spanGaps: true, label: "rhr" },
      { data: unusual, showLine: false, pointRadius: 6, pointBackgroundColor: "#e06a4f", pointBorderColor: "#0e1113", pointBorderWidth: 2 } ] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, filter: c => c.datasetIndex === 2, callbacks: { label: c => `${c.parsed.y.toFixed(0)} bpm` + (rows[c.dataIndex].rhr_base != null ? ` (normal ${rows[c.dataIndex].rhr_base.toFixed(0)})` : "") } } },
      scales: { ...base.scales, y: { ...base.scales.y, grace: "15%", ticks: { maxTicksLimit: 5, precision: 0 } } } } });
  const rv = rows.filter(r => r.rhr != null);
  if (rv.length >= 6) { const half = Math.floor(rv.length / 2), a = rv.slice(0, half), b = rv.slice(half), m = x => x.reduce((s, r) => s + r.rhr, 0) / x.length, d = m(b) - m(a);
    $("rhrNote").textContent = Math.abs(d) < 0.5 ? "steady" : `${d < 0 ? "▼" : "▲"} ${Math.abs(d).toFixed(1)} bpm over period`; } else $("rhrNote").textContent = "";

  // sleep floating bars, hours relative to wake-day midnight
  // hours relative to midnight of the wake day, in local time (bedtime before midnight is negative)
  const rel = (d, wake) => hourOf(d) - (localDateStr(d) < wake ? 24 : 0);
  const sl = rows.map(r => r.sleep_start ? [rel(r.sleep_start, r.date), rel(r.sleep_end, r.date)] : null);
  const hl = hourLbl;
  chart("cSleep", { type: "bar", data: { labels: lbl, datasets: [{ data: sl, backgroundColor: rows.map(r => (r.sleep_h || 0) >= 7 ? "#8f86e8" : "#e8a33a"), borderRadius: 6, barPercentage: .7, borderSkipped: false }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { label: c => { const r = rows[c.dataIndex]; return r.sleep_start ? `${clock(r.sleep_start)} – ${clock(r.sleep_end)} · ${hrsMin(r.sleep_h)}` : ""; } } } },
      scales: { ...base.scales, y: { ...base.scales.y, reverse: true, min: -4, max: 11, ticks: { stepSize: 3, callback: hl } } } } });
  const sv = rows.filter(r => r.sleep_h != null);
  $("slNote").textContent = sv.length ? `avg ${hrsMin(sv.reduce((a, r) => a + r.sleep_h, 0) / sv.length)}` : "";

  chart("cSteps", { type: "bar", data: { labels: lbl, datasets: [{ data: rows.map(r => r.steps), backgroundColor: "#2fbf8f", borderRadius: 5, barPercentage: .7 }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { ...base.plugins.tooltip, callbacks: { label: c => `${c.parsed.y.toLocaleString()} steps` } } },
      scales: { ...base.scales, y: { ...base.scales.y, beginAtZero: true, ticks: { maxTicksLimit: 4, callback: v => v >= 1000 ? v / 1000 + "k" : v } } } } });
  const stv = rows.filter(r => r.date < localDateStr(new Date()));
  $("stNote").textContent = stv.length ? `avg ${Math.round(stv.reduce((a, r) => a + (r.steps || 0), 0) / stv.length).toLocaleString()}/day` : "";
}

$("prev").onclick = () => { dayOffset++; renderDay(); };
$("next").onclick = () => { dayOffset = Math.max(0, dayOffset - 1); renderDay(); };
document.querySelectorAll("#range button").forEach(b => b.onclick = () => { document.querySelectorAll("#range button").forEach(x => x.classList.remove("on")); b.classList.add("on"); range = +b.dataset.n; renderTrends(); });
load();
</script>
</body>
</html>
